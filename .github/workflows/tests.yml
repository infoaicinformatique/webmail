name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Nextcloud 28 (PHP 8.1) to Nextcloud 34 (PHP 8.5)
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --display-deprecations

  static:
    name: JS syntax, translations, info.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Generated translations are up to date
        run: php l10n/build.php && git diff --exit-code -- l10n
      - name: info.xml follows the App Store schema
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
