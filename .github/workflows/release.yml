name: Release

# Each new version (appinfo/info.xml) that reaches main is published as a GitHub
# release v<version>, with the archive to extract into nextcloud/custom_apps
# (make dist). Also from a tag v<version>, or by hand (Actions → Release → Run).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Archive and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version of info.xml, not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but appinfo/info.xml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already published: nothing to do"
            echo "PUBLISH=no" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=yes" >> "$GITHUB_ENV"
          fi
      - name: Archive
        if: env.PUBLISH == 'yes'
        run: |
          make dist
          cd build && sha256sum "webmail-$VERSION.tar.gz" > "webmail-$VERSION.tar.gz.sha256"
      - name: Release
        if: env.PUBLISH == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Webmail Exchange $VERSION for Nextcloud 28 to 34 (PHP 8.1 to 8.5).

          Installation (path and web user to adapt):

          \`\`\`bash
          sudo rm -rf /var/www/nextcloud/custom_apps/webmail
          sudo tar -xzf webmail-$VERSION.tar.gz -C /var/www/nextcloud/custom_apps/
          sudo chown -R www-data:www-data /var/www/nextcloud/custom_apps/webmail
          sudo -u www-data php /var/www/nextcloud/occ app:enable webmail
          sudo -u www-data php /var/www/nextcloud/occ upgrade
          \`\`\`

          SHA-256: $(cut -d' ' -f1 "build/webmail-$VERSION.tar.gz.sha256")
          NOTES
          # the tag v<version> is created on this commit when it does not exist yet
          gh release create "v$VERSION" "build/webmail-$VERSION.tar.gz" "build/webmail-$VERSION.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "Webmail Exchange $VERSION" --notes-file notes.md
